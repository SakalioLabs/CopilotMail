<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CopilotMail</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0e1c2f;--line:#203451;--text:#e7f0ff;--muted:#8fa6c4;--brand:#6ce5b1;--accent:#75a8ff}*{box-sizing:border-box}body{margin:0;font:15px Inter,system-ui;background:radial-gradient(circle at 20% 0,#173253 0,transparent 34%),var(--bg);color:var(--text)}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:14px}header b{font-size:21px}.dot{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 18px var(--brand)}main{max-width:1180px;margin:44px auto;padding:0 24px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}h1{font-size:42px;margin:0 0 8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:340px 1fr;gap:20px}.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 60px #0004}label{display:block;color:var(--muted);margin:14px 0 6px}input,textarea{width:100%;border:1px solid var(--line);background:#091525;color:var(--text);border-radius:10px;padding:11px 12px}textarea{min-height:100px;resize:vertical}button{border:0;border-radius:10px;padding:11px 15px;background:var(--accent);color:#06101e;font-weight:700;cursor:pointer}button.secondary{background:#19304d;color:var(--text)}button:disabled{opacity:.5}.actions{display:flex;gap:10px;margin-top:16px}.status{padding:12px;border-radius:10px;background:#0a1728;margin-top:16px;white-space:pre-wrap}.message{padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}.message:last-child{border:0}.message strong{display:block;margin-bottom:4px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#14334b;color:var(--brand)}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column;gap:12px}}
  </style>
</head>
<body><header><span class="dot"></span><b>CopilotMail</b><span class="muted">Agent-native mail infrastructure</span></header>
<main><section class="hero"><div><h1>Agent 邮件控制台</h1><div class="muted">API 与前端解耦 · 自研 SMTP · WebSocket 实时事件</div></div><span id="connection" class="badge">未连接</span></section>
<div class="grid"><section class="card"><h2>邮箱登录</h2><label>邮箱地址</label><input id="address" placeholder="agent@mail.local"><label>密码</label><input id="password" type="password"><div class="actions"><button id="login">登录并监听</button><button id="refresh" class="secondary">刷新</button></div><div id="status" class="status muted">请先登录邮箱。</div><hr style="border-color:var(--line);margin:24px 0"><h2>发送邮件</h2><label>收件人</label><input id="to"><label>主题</label><input id="subject"><label>正文</label><textarea id="body"></textarea><button id="send" style="margin-top:12px">发送</button></section><section class="card"><h2>收件箱</h2><div id="messages" class="muted">暂无邮件</div></section></div></main>
<script>
const $=id=>document.getElementById(id);let token='',socket;
async function api(path,options={}){options.headers={...(options.headers||{}),...(token?{Authorization:`Bearer ${token}`}:{})};const r=await fetch(path,options);if(!r.ok)throw new Error(await r.text()||r.statusText);return r.status===204?null:r.json()}
async function login(){try{const data=await api('/v1/auth/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:$('address').value,password:$('password').value})});token=data.token;$('status').textContent=`已登录 ${data.mailbox.address}`;watch();await refresh()}catch(e){$('status').textContent=`登录失败：${e.message}`}}
async function refresh(){if(!token)return;try{const list=await api('/v1/messages');$('messages').innerHTML=list.length?list.map(m=>`<article class="message"><strong>${escapeHtml(m.subject)}</strong><div class="muted">${escapeHtml(m.sender)} · ${new Date(m.received_at).toLocaleString()}</div></article>`).join(''):'<span class="muted">暂无邮件</span>'}catch(e){$('status').textContent=e.message}}
function watch(){if(socket)socket.close();const scheme=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(`${scheme}://${location.host}/v1/events?token=${encodeURIComponent(token)}`);socket.onopen=()=>{$('connection').textContent='实时监听中'};socket.onmessage=()=>refresh();socket.onclose=()=>{$('connection').textContent='连接已断开'}}
async function send(){try{await api('/v1/messages/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:$('to').value,subject:$('subject').value,text:$('body').value})});$('status').textContent='邮件已接受投递'}catch(e){$('status').textContent=`发送失败：${e.message}`}}
function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
$('login').onclick=login;$('refresh').onclick=refresh;$('send').onclick=send;
</script></body></html>
