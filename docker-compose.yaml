services:
  copilotmail:
    build: .
    container_name: copilotmail
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${SMTP_PORT:-2525}:2525"
    volumes:
      - copilotmail-data:/data
    healthcheck:
      test: ["CMD", "copilotmail", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  copilotmail-data:

