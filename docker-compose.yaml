services:
  copilotmail:
    build: .
    container_name: copilotmail
    restart: unless-stopped
    env_file: .env
    ports:
      # V1 regression baseline: default to loopback so the prototype is never
      # exposed to a non-loopback network by accident. BIND_ADDR=0.0.0.0 is a
      # deliberate, explicit opt-in only.
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
      - "${BIND_ADDR:-127.0.0.1}:${SMTP_PORT:-2525}:2525"
    volumes:
      - copilotmail-data:/data
    healthcheck:
      test: ["CMD", "copilotmail", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  copilotmail-data:

