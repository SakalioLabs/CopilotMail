server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self' https:; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*" always;
    location = /mail-healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /runtime-config.js { alias /tmp/runtime-config.js; default_type application/javascript; add_header Cache-Control "no-store" always; }
    # Authorization callbacks carry one-time code/state values in the query.
    # They are forwarded intact but must never enter reverse-proxy request logs.
    location ~ ^/api/v2/auth/(admin|mail)/(login|callback)$ {
        access_log off;
        error_log /dev/null emerg;
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
    location /api/ {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
    location / { try_files $uri $uri/ /index.html; }
}
