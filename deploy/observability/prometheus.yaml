global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: copilotmail-audit-maintenance
    static_configs:
      - targets: ["audit-maintenance:9090"]

  - job_name: copilotmail-agent-event-stream
    static_configs:
      - targets: ["api:9091"]
