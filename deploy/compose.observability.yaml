name: copilotmail-v2-dev

# Development-only observability overlay. Run together with compose.dev.yaml;
# the collector is an internal hop and the UI ports bind to loopback by default.
services:
  api:
    environment:
      COPILOTMAIL_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      COPILOTMAIL_OTEL_ALLOW_INSECURE_HTTP: "true"
      COPILOTMAIL_OTEL_SERVICE_NAME: copilotmail-control-api

  worker:
    environment:
      COPILOTMAIL_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      COPILOTMAIL_OTEL_ALLOW_INSECURE_HTTP: "true"
      COPILOTMAIL_OTEL_SERVICE_NAME: copilotmail-control-worker

  audit-maintenance:
    environment:
      COPILOTMAIL_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      COPILOTMAIL_OTEL_ALLOW_INSECURE_HTTP: "true"
      COPILOTMAIL_OTEL_SERVICE_NAME: copilotmail-audit-maintenance

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started
    expose: ["4318", "8888", "13133"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [backend]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.5
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - copilotmail-v2-tempo:/var/tempo
    expose: ["3200", "4317"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [backend]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - copilotmail-v2-prometheus:/prometheus
    ports:
      - "${COPILOTMAIL_PROMETHEUS_BIND:-127.0.0.1:9091}:9090"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/copilotmail.yaml:ro
      - copilotmail-v2-grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    ports:
      - "${COPILOTMAIL_GRAFANA_BIND:-127.0.0.1:3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/grafana/plugins
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [backend]
    restart: unless-stopped

volumes:
  copilotmail-v2-tempo:
  copilotmail-v2-prometheus:
  copilotmail-v2-grafana:
