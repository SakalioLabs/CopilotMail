        SMTP, or mail-content API. Missing, cross-tenant, non-Agent,
        mismatched, and non-production-admission pairs are indistinguishable.
        POST is required because a successful observation appends immutable
        audit evidence; Admin browser sessions therefore receive the existing
        Origin/CSRF protection for state-changing operations.
