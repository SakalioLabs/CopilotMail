openapi: 3.1.0
info:
  title: CopilotMail V2 Control Plane
  version: 0.2.0-alpha.1
  description: Enterprise control-plane contract. Protected routes fail closed until a trusted identity adapter is configured.
servers:
  - url: http://127.0.0.1:8081
paths:
  /healthz:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: Process is serving HTTP.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Required dependencies and schema are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A dependency is unavailable or migration is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v2/system/info:
    get:
      operationId: getSystemInfo
      responses:
        "200":
          description: Public API and build compatibility information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /api/v2/auth/{client}/login:
    get:
      operationId: beginHumanBrowserLogin
      summary: Start a server-side Human OIDC Authorization Code + PKCE flow.
      description: >
        Creates a one-time digest-bound login transaction, sets a Host-only
        HttpOnly login cookie, and redirects to the configured enterprise IdP.
        The return target is restricted to a local absolute path.
      security: []
      parameters:
        - name: client
          in: path
          required: true
          schema:
            type: string
            enum: [admin, mail]
        - name: return_to
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 1024
            pattern: "^/(?!/).*"
      responses:
        "307":
          description: Redirect to the trusted OIDC authorization endpoint.
          headers:
            Set-Cookie:
              description: Host-only HttpOnly login binding; Secure in production.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429":
          description: The cluster-wide login admission limit for this browser client is exhausted.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1, maximum: 60 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/auth/{client}/callback:
    get:
      operationId: completeHumanBrowserLogin
      summary: Consume one OIDC callback and establish a server-side Human session.
      description: >
        Requires both the one-time callback state and the matching HttpOnly
        browser nonce cookie. The authorization code and provider token are
        consumed only by the server and are never returned to browser JavaScript.
        Reverse proxies must suppress query-bearing request and error logs.
      security: []
      parameters:
        - name: client
          in: path
          required: true
          schema:
            type: string
            enum: [admin, mail]
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: iss
          in: query
          required: false
          schema: { type: string, format: uri }
        - name: error
          in: query
          required: false
          schema: { type: string }
        - name: error_description
          in: query
          required: false
          schema: { type: string }
      responses:
        "303":
          description: >
            Session creation, High Audit, and Outbox evidence committed; redirect
            to the configured client origin and validated local return path.
          headers:
            Set-Cookie:
              description: Host-only HttpOnly opaque session cookie; Secure in production.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/auth/admin/session:
    get:
      operationId: getAdminHumanBrowserSession
      summary: Resolve the current opaque Admin Human browser session.
      description: >
        Re-evaluates session expiry, revocation, Active Human status, tenant
        binding, Admin client partition, and live RBAC without disclosing any
        provider token.
      security:
        - adminBrowserSession: []
      responses:
        "200":
          description: Current non-secret Admin Human session context.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanSession"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/auth/admin/logout:
    post:
      operationId: revokeAdminHumanBrowserSession
      summary: Append an auditable revocation for the current Admin Human session.
      description: >
        Requires an exact Admin Origin and Admin session cookie. Revocation,
        High Audit, and Outbox evidence commit atomically.
      security:
        - adminBrowserSession: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema: { type: string, format: uri }
      responses:
        "204":
          description: Session revoked or an exact prior revocation replayed.
          headers:
            Set-Cookie:
              description: Clears the opaque Admin session cookie.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/auth/mail/session:
    get:
      operationId: getMailHumanBrowserSession
      summary: Resolve the current opaque Mail Human browser session.
      description: >
        Re-evaluates session expiry, revocation, Active Human status, tenant
        binding, Mail client partition, and live RBAC without disclosing any
        provider token.
      security:
        - mailBrowserSession: []
      responses:
        "200":
          description: Current non-secret Mail Human session context.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanSession"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/auth/mail/logout:
    post:
      operationId: revokeMailHumanBrowserSession
      summary: Append an auditable revocation for the current Mail Human session.
      description: >
        Requires an exact Mail Origin and Mail session cookie. Revocation,
        High Audit, and Outbox evidence commit atomically.
      security:
        - mailBrowserSession: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema: { type: string, format: uri }
      responses:
        "204":
          description: Session revoked or an exact prior revocation replayed.
          headers:
            Set-Cookie:
              description: Clears the opaque Mail session cookie.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /oauth2/token:
    post:
      operationId: issueAgentAccessToken
      summary: Exchange an Agent private_key_jwt or verified mTLS credential for an access token.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AgentTokenRequest"
      responses:
        "200":
          description: Short-lived Agent access token.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTokenResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
        "503":
          $ref: "#/components/responses/OAuthError"
  /oauth2/jwks.json:
    get:
      operationId: getAgentAuthorizationServerJwks
      summary: Publish every Agent access-token verification key in the active rotation window.
      security: []
      responses:
        "200":
          description: RFC 7517 JSON Web Key Set.
          headers:
            Cache-Control:
              schema:
                type: string
                const: public, max-age=60, must-revalidate
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentJwks"
        "304":
          description: The caller's If-None-Match value still identifies the current key set.
        "503":
          $ref: "#/components/responses/OAuthError"
  /internal/v2/mail-engine/stalwart/events:
    post:
      operationId: ingestStalwartMailEvents
      summary: Verify and atomically ingest a bounded Stalwart telemetry batch.
      description: >
        Internal data-plane callback. Both the file-backed Bearer credential
        and Base64 HMAC-SHA256 X-Signature over the exact request body are
        mandatory. The allowlist contains message-ingest.ham/spam plus
        delivery.delivered, delivery.failed, queue.rescheduled, and
        delivery.completed. Queue delivery evidence is operational and is not
        heuristically correlated to a JMAP submission.
      security:
        - mailEventBearer: []
          stalwartHmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StalwartEventBatch"
      responses:
        "202":
          description: Entire batch committed or recognized as exact replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailEventIngressResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: Request body exceeds one MiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/organizations/{organization_id}:
    get:
      operationId: getOrganization
      security:
        - adminBrowserSession: []
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized organization metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v2/organizations/{organization_id}/audit-events:
    get:
      operationId: searchAuditEvents
      summary: Search immutable tenant audit evidence in descending chain order.
      description: >
        Human-only audit.read endpoint. Defaults to the latest 24 hours and
        rejects windows longer than 31 days. Every successful query, including
        an empty result, is itself committed to Audit and Outbox before results
        are returned. Clients must reuse the response occurred_from/occurred_to
        and all filters when continuing with next_cursor.
      security:
        - adminBrowserSession: []
        - bearerAuth: [audit.read]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: occurred_from
          in: query
          schema: { type: string, format: date-time }
        - name: occurred_to
          in: query
          schema: { type: string, format: date-time }
        - name: action
          in: query
          schema:
            type: string
            maxLength: 100
            pattern: "^[a-z][a-z0-9_.]+$"
        - name: actor_principal_id
          in: query
          schema: { type: string, format: uuid }
        - name: resource_type
          in: query
          schema:
            type: string
            maxLength: 100
            pattern: "^[a-z][a-z0-9_.]+$"
        - name: resource_id
          in: query
          description: Requires resource_type to be present.
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, failure, denied]
        - name: request_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: cursor
          in: query
          description: Opaque tenant-scoped chain cursor from the prior page.
          schema:
            type: string
            maxLength: 64
            pattern: "^v1\\.[0-9a-f-]{36}\\.[1-9][0-9]*$"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: >
            Immutable evidence rows. Hashes are lowercase SHA-256 hex and
            details remain subject to the audit data-minimization policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventSearch"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Cursor anchor is unavailable or does not match the active filters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/organizations/{organization_id}/compliance-cases:
    get:
      operationId: listComplianceCases
      summary: List tenant compliance cases in stable newest-first order.
      description: >
        Active Human-only bounded read model. Cursor anchors are validated
        against the tenant and active status filter before a page is returned.
      security: [{ adminBrowserSession: [] }, { bearerAuth: [] }]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [open, closed] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Bounded compliance case page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceCaseList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Cursor is unavailable or does not match the active tenant/filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createComplianceCase
      summary: Open a tenant compliance case as an active authorized Human.
      security: [{ adminBrowserSession: [] }, { bearerAuth: [] }]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplianceCaseCreate" }
      responses:
        "201":
          description: Compliance case opened with atomic Audit and Outbox evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceCase" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/organizations/{organization_id}/legal-holds:
    get:
      operationId: listLegalHolds
      summary: List tenant Legal Holds with bounded status and case filters.
      security: [{ adminBrowserSession: [] }, { bearerAuth: [] }]
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [active, released] }
        - name: case_id
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Bounded Legal Hold page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalHoldList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Cursor is unavailable or does not match the active tenant/filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/compliance-cases/{case_id}:
    get:
      operationId: getComplianceCase
      summary: Read one tenant compliance case without exposing cross-tenant existence.
      security: [{ adminBrowserSession: [] }, { bearerAuth: [] }]
      parameters:
        - name: case_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Compliance case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceCase" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/compliance-cases/{case_id}/closure:
    post:
      operationId: closeComplianceCase
      summary: Close a compliance case only when no active Legal Hold remains.
      security: [{ adminBrowserSession: [] }, { bearerAuth: [] }]
      parameters:
        - name: case_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Closed compliance case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceCase" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/audit-archives/{archive_id}/legal-holds:
    post:
      operationId: applyAuditArchiveLegalHold
      summary: Apply Legal Hold to both exact object versions in an audit archive.
      description: >
        Active Human-only operation requiring legal_hold.manage and an exact
        approved compliance.legal_hold request targeting audit.archive. The
        database changes only after both S3 Version IDs read back On.
      security: [{ adminBrowserSession: [] }, { bearerAuth: [] }]
      parameters:
        - name: archive_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalHoldApply" }
      responses:
        "200":
          description: Exact idempotent replay of an existing active hold.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalHold" }
        "201":
          description: Both remote versions verified On and local evidence committed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalHold" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/audit-archives/{archive_id}/exports:
    post:
      operationId: authorizeAuditArchiveExport
      summary: Create a short-lived authorization for one exact immutable audit archive.
      description: >
        Active Human-only operation requiring audit.export and an exact,
        unexpired audit.export approval targeting this audit.archive. At least
        two independent approvals are required. Replaying the same approval
        returns the same immutable grant.
      security: [{ adminBrowserSession: [] }, { bearerAuth: [] }]
      parameters:
        - name: archive_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditExportGrantCreate" }
      responses:
        "201":
          description: New or exactly replayed export authorization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditExportGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/audit-archives/{archive_id}/export-grants/{approval_request_id}:
    get:
      operationId: reconcileAuditArchiveExportGrant
      summary: Reconcile one exact audit export authorization without creating anything.
      description: >
        Read-only exact reconciliation for a client whose authorization POST
        outcome is unknown. Active Human-only access requires audit.export and
        returns metadata only when the canonical archive ID, canonical approval
        request ID, tenant, and requesting Human all match the already
        persisted immutable grant. This endpoint never creates or replays a
        grant and never writes Audit, Outbox, or download-ledger evidence.
      security: [{ adminBrowserSession: [] }, { bearerAuth: [] }]
      parameters:
        - name: archive_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: approval_request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The caller's exact immutable export authorization metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditExportGrant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/audit-export-grants/{grant_id}:
    get:
      operationId: getAuditExportGrant
      summary: Read the caller's exact audit export authorization.
      security: [{ adminBrowserSession: [] }, { bearerAuth: [] }]
      parameters:
        - name: grant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Immutable export authorization metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditExportGrant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/audit-export-grants/{grant_id}/artifacts/{artifact}:
    post:
      operationId: downloadAuditExportArtifact
      summary: Retrieve one exact immutable archive artifact under an active grant.
      description: >
        Active Human-only operation requiring audit.export and an unexpired
        grant held by the calling Principal. The object version is re-read from
        the WORM bucket and reverified against the digest and size recorded when
        the archive was created, and the retrieval is committed to an
        append-only download ledger before any byte is returned. POST is
        intentional because this operation creates evidence and must pass the
        exact-Origin CSRF boundary.
      security: [{ adminBrowserSession: [] }, { bearerAuth: [] }]
      parameters:
        - name: grant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: artifact
          in: path
          required: true
          schema: { type: string, enum: [events, manifest] }
      responses:
        "200":
          description: >
            Verified archive bytes. The X-CopilotMail-Artifact-SHA256 header
            repeats the verified digest for independent client-side checking.
          headers:
            X-CopilotMail-Artifact-SHA256:
              description: Lowercase hex SHA-256 of the returned bytes.
              schema: { type: string, pattern: "^[0-9a-f]{64}$" }
            Content-Length:
              description: Exact decimal byte length of the verified artifact.
              schema: { type: integer, format: int64, minimum: 1 }
            Content-Disposition:
              description: Attachment filename derived only from the export grant and artifact kind.
              schema: { type: string }
            Cache-Control:
              description: Always `no-store`; export bytes must not be retained by intermediaries.
              schema: { type: string, enum: [no-store] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
