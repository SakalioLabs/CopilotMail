      description: >
        Human Mail browser-session only. Admin browser cookies and every Bearer
        credential are rejected before mailbox storage is queried. The result
        is a minimized capability projection and never exposes tenant,
        provider, binding, owner, role-assignment, or delegation internals.
      security:
        - mailBrowserSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 39
            maxLength: 39
            pattern: "^v1\\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            example: v1.018f13b9-2222-7bc8-965d-48a28866f073
      responses:
        "200":
          description: Stable mailbox selector page ordered by mailbox identity.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanMailboxDirectory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/MailSessionUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/mailboxes/{mailbox_id}:
    get:
      operationId: getMailbox
      summary: Read a mailbox projection only after RBAC, token scope, and resource ABAC.
      security:
        - adminBrowserSession: []
        - bearerAuth: []
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Mailbox visible to the authenticated Principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Mailbox is absent, cross-tenant, cross-resource, expired, revoked, or otherwise hidden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v2/mailboxes/{mailbox_id}/messages:
    get:
      operationId: listInboxMessages
      summary: List bounded message envelopes for an authorized Human mailbox.
      description: Requires Human OIDC, mailbox.use, resource-level Read access, an exact tenant-bound JMAP Account, and one readable role=inbox Mailbox. Every provider document must already have an exact inbound UUID projection. Query state, provider Email/Thread identifiers, bodies, raw headers, and blob identifiers are not returned. Minimized Audit and Outbox evidence must commit before disclosure.
      security:
        - mailBrowserSession: []
        - bearerAuth: []
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 2048 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 30 }
      responses:
        "200":
          description: Newest-first envelope page.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Mailbox is absent, inaccessible, cross-tenant, or unbound.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/mailboxes/{mailbox_id}/messages/search:
    post:
      operationId: searchInboxMessages
      summary: Search one authorized Human mailbox without putting search text in the URL.
      description: >
        Requires Human OIDC, mailbox.use, resource-level Read access, and an
        exact tenant-bound JMAP Account. Search text is sent only in the JSON
        body. Pagination cursors contain a one-way query digest and cannot be
        reused with another search. They do not contain provider query state.
        Results contain bounded, pre-projected Inbox envelopes only.
      security:
        - mailBrowserSession: []
        - bearerAuth: []
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboxSearch" }
      responses:
        "200":
          description: Newest-first matching envelope page.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Mailbox is absent, inaccessible, cross-tenant, or unbound.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/mailboxes/{mailbox_id}/messages/{message_id}:
    get:
      operationId: getInboxMessage
      summary: Read one bounded plain-text message detail as an authorized Human.
      description: Resolves only an existing safe UUID under the current tenant/mailbox binding and returns text/plain body values and attachment metadata only after mail.message.read Audit and minimized Outbox evidence commit. Raw MIME, HTML body, headers, provider query state, and blob identifiers never cross the adapter boundary.
      security:
        - mailBrowserSession: []
        - bearerAuth: []
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Safe bounded message detail.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateInboxMessageState
      summary: Update Human read or flagged state without affecting Agent delivery state.
      security:
        - mailBrowserSession: []
        - bearerAuth: []
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageStateUpdate" }
      responses:
        "200":
          description: Authoritative JMAP keyword state after the update.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/agent/mailboxes/{mailbox_id}/messages/{message_id}/content:
    get:
      operationId: readAgentMailContent
      summary: Read one Feed-addressed message as bounded untrusted plain text.
      description: >
        Agent-only. message_id is the CopilotMail UUID from message.received.v1,
        never a caller-selected JMAP document identifier. Requires
        agent.operate, agent.mail.read, mailbox.use, exact mailbox Read ABAC,
        an active Agent, and cluster-wide ingress capacity. The response omits
        HTML, raw MIME, headers, recipient lists, attachment metadata/content,
        Blob IDs, Thread IDs, JMAP IDs and Human read/flag state. A successful
        disclosure is audited before content is returned.
      security:
        - bearerAuth: [agent.operate, agent.mail.read, mailbox.use]
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Explicitly untrusted, bounded plain-text content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMailContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Agent tenant or principal ingress capacity is exhausted.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1, maximum: 60 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/agent/mailboxes/{mailbox_id}/processing-subscription:
    put:
      operationId: ensureAgentProcessingSubscription
      summary: Ensure the authenticated Agent has one processing subscription for a readable mailbox.
      description: >
        Agent-only idempotent setup. Tenant and Agent identity come exclusively
        from authentication. The mailbox must have current Read ABAC. Human
        read/flag state and webhook delivery subscriptions are independent.
      security:
        - bearerAuth: [agent.operate, mailbox.use]
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Existing or newly created self-bound processing subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProcessingSubscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/AgentRateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/agent/processing-subscriptions/{subscription_id}:
    patch:
      operationId: changeAgentProcessingSubscription
      summary: Pause, resume, or permanently retire the authenticated Agent's subscription.
      description: >
        Owner-bound Agent-only lifecycle transition with exact
        Idempotency-Key replay. Pausing keeps durable inbound Fanout as a
        pending backlog but stops new Claim work, while allowing an already
        leased message to be extended, acknowledged, or nacked. Resuming
        revalidates current mailbox Read ABAC. Retirement is terminal and is
        rejected while an unexpired lease exists.
      security:
        - bearerAuth: [agent.operate, mailbox.use]
      parameters:
        - $ref: "#/components/parameters/AgentProcessingSubscriptionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProcessingSubscriptionChange" }
      responses:
        "200":
          description: Lifecycle transition result or exact replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProcessingSubscriptionChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/AgentRateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/agent/processing-subscriptions/{subscription_id}/claims:
    post:
      operationId: claimAgentMessage
      summary: Claim the next pending message with a bounded exclusive lease.
      description: >
        Claims at most one message using ordered FOR UPDATE SKIP LOCKED. An
        expired lease may be reclaimed. Exact Idempotency-Key replay returns
        the original operation; reuse with different parameters is rejected.
      security:
        - bearerAuth: [agent.operate, mailbox.use]
      parameters:
        - $ref: "#/components/parameters/AgentProcessingSubscriptionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMessageClaim" }
      responses:
        "200":
          description: Message claimed or exact operation replayed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMessageProcessing" }
        "204": { description: No currently claimable message. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/AgentRateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/agent/processing-subscriptions/{subscription_id}/dead-letters:
    get:
      operationId: listAgentProcessingDeadLetters
      summary: List the authenticated Agent's terminal processing failures.
      description: >
        Agent-only, owner-bound and Read-ABAC-revalidated query. Cursor anchors
        must identify a real dead-letter row in the same subscription. The
        response contains only Message UUID, attempt count, bounded machine
        reason code and failure time; no content, address, engine identifier,
        provider response, Human state, or another Agent's state is exposed.
        The query is audited and committed before results are returned.
      security:
        - bearerAuth: [agent.operate, mailbox.use]
      parameters:
        - $ref: "#/components/parameters/AgentProcessingSubscriptionId"
        - name: cursor
          in: query
          schema: { type: string, maxLength: 80 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Bounded page of self-owned processing dead letters.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProcessingDeadLetterList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/AgentRateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/agent/processing-subscriptions/{subscription_id}/messages/{message_id}/lease-extension:
    post:
      operationId: extendAgentMessageLease
      summary: Extend the caller's matching unexpired processing lease.
      security:
        - bearerAuth: [agent.operate, mailbox.use]
      parameters:
        - $ref: "#/components/parameters/AgentProcessingSubscriptionId"
        - $ref: "#/components/parameters/AgentProcessingMessageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMessageLeaseExtension" }
      responses:
        "200":
          description: Lease extended or exact operation replayed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMessageProcessing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/AgentRateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/agent/processing-subscriptions/{subscription_id}/messages/{message_id}/acknowledgement:
    post:
      operationId: acknowledgeAgentMessage
      summary: Acknowledge successful processing with the matching unexpired lease.
      security:
        - bearerAuth: [agent.operate, mailbox.use]
      parameters:
        - $ref: "#/components/parameters/AgentProcessingSubscriptionId"
        - $ref: "#/components/parameters/AgentProcessingMessageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMessageAcknowledgement" }
      responses:
        "200":
          description: Message acknowledged or exact operation replayed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMessageProcessing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/AgentRateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/agent/processing-subscriptions/{subscription_id}/messages/{message_id}/nack:
    post:
      operationId: nackAgentMessage
      summary: Return a failed message to pending or dead-letter it after bounded retries.
      description: >
        reason_code is a bounded machine code and must not contain raw provider
        errors, message content, addresses, tokens, or secrets.
      security:
        - bearerAuth: [agent.operate, mailbox.use]
      parameters:
        - $ref: "#/components/parameters/AgentProcessingSubscriptionId"
        - $ref: "#/components/parameters/AgentProcessingMessageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMessageNack" }
      responses:
        "200":
          description: Message returned to pending, dead-lettered, or exact operation replayed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMessageProcessing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/AgentRateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/agent/mail-policy:
    get:
      operationId: getOwnAgentMailPolicy
      summary: Read the authenticated Agent's effective mail permissions, policy, and hourly usage.
      description: >
        Agent-only self-service endpoint. Tenant and Agent identity are taken
        exclusively from the authenticated token. The response exposes the
        active production policy and aggregate rolling-hour Admission count, but
        never recipient references, recipient-level usage, thread references,
        approval IDs, message IDs, or engine identifiers. Production Agents
        without an active policy report blocked_no_active_policy. Development
        and testing Agents report not_required.
      security:
        - bearerAuth: [agent.operate]
      responses:
        "200":
          description: Current self-bound Agent mail policy and aggregate usage snapshot.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnAgentMailPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: Agent tenant or principal ingress capacity is exhausted.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1, maximum: 60 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/mailboxes/{mailbox_id}/drafts:
    get:
      operationId: listHumanDrafts
      summary: List the current Human's own active drafts in one mailbox.
      description: >
        Human Mail browser-session only. Requires an active Human,
        mailbox.use, and simultaneous resource-level Read and Send access on
        the current data-plane binding. Shared-mailbox ownership or membership
        never grants access to another principal's drafts. Results come only
        from control-plane provenance and contain no subject, body, address,
        content digest, or provider identifier. Minimized Audit and Outbox
        evidence must commit before disclosure.
      security:
        - mailBrowserSession: []
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 39
            maxLength: 39
            pattern: "^v1\\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      responses:
        "200":
          description: Stable page ordered by descending CopilotMail draft UUIDv7.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanDraftList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/MailSessionUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: saveTextDraft
      summary: Create or replace a bounded principal-owned plain-text draft.
      description: >
        Human callers require mailbox.use. Agents additionally require
        agent.operate and consume cluster-wide ingress capacity. Production
        Agents must have an active immutable mail policy; its recipient-domain
        and per-message bounds are checked before the JMAP call and again by
        PostgreSQL. All callers require
        resource-level Send access and an exact tenant-bound JMAP Account.
        From is derived from the authorized mailbox. A previous immutable JMAP
        draft is replaced by creating the new version and destroying the
        server-resolved previous version. An explicit reply accepts only a
        CopilotMail inbound message UUID, additionally requires Read access,
        and derives JMAP inReplyTo/references from the exact source Email.
        Draft ownership is exact to the
        authenticated principal; engine Email and Thread identifiers never
        cross the API boundary.
      security:
        - mailBrowserSession: []
        - bearerAuth: []
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TextDraftSave" }
      responses:
        "201":
          description: >
            New authoritative draft identity. If previous_draft_destroyed is
            false, the new draft was saved but the prior remote version could
            not be removed and the client must surface that condition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TextDraft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429":
          description: Agent tenant or principal ingress capacity is exhausted.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1, maximum: 60 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/mailboxes/{mailbox_id}/drafts/{draft_id}/restore:
    post:
      operationId: restoreHumanDraft
      summary: Restore the current Human's exact active plain-text draft version.
      description: >
        Human Mail browser-session only. The server resolves one exact owned
        active draft from PostgreSQL, performs a bounded JMAP Email/get by its
        server-held identity, and verifies the current account/data-plane,
        unique Drafts mailbox, $draft keyword, From address, Thread identity,
        recipients, body reference, and complete content digest. It never
        enumerates remote Drafts. Authorization and draft version are checked
        again in the same transaction that commits Audit and Outbox evidence;
        content is returned only after that commit. Missing or drifted remote
        evidence is a non-disclosing conflict and is never reconstructed by
        scanning another account or data plane.
      security:
        - mailBrowserSession: []
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: draft_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HumanDraftRestoreRequest" }
      responses:
        "200":
          description: Verified plain-text snapshot of the exact active draft version.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanDraftRestore" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/MailSessionUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: Request body exceeds the bounded Human Mail JSON limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Content-Type is not application/json.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/mailboxes/{mailbox_id}/submissions:
    get:
      operationId: listHumanSentSubmissions
      summary: List the current Human's own accepted submissions and delivery summaries.
      description: >
        Human Mail browser-session only. Requires an active Human, mailbox.use,
        and simultaneous resource-level Read and Send access. Shared-mailbox
        membership never reveals another principal's submission history. The
        directory is local durable evidence only: it performs no JMAP call and
        remains readable after a valid data-plane rebinding. It returns only
        accepted submissions whose frozen Draft is durably sent, ordered by
        accepted_at then submission UUID descending. Optional delivery data is
        aggregate-only; no subject, body, address, recipient digest, SMTP
        reply, Draft reference, provider reference, or error detail crosses
        this contract. Authorization and every disclosed result are rechecked
        in the Audit/Outbox transaction before any response is returned. HEAD
        is intentionally rejected after Mail-session authentication so it
        cannot generate disclosure evidence through an implicit GET fallback.
      security:
        - mailBrowserSession: []
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 39
            maxLength: 39
            pattern: "^v1\\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      responses:
        "200":
          description: Stable accepted-submission page ordered by acceptance time then UUID.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanSentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/MailSessionUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: requestMailSubmission
      summary: Freeze one exact draft version and create a recoverable submission Intent.
      description: >
        Supports Human principals, development Agents, and production Agents
        holding a committed active policy. Testing Agents are rejected with
        agent_mail_sandbox_required and must use the non-delivering sandbox
        endpoint. A production Agent request
        atomically enforces recipient domains, per-message/hour/per-recipient
        quotas and exact live first-contact approval before the Intent is
        committed. Eligible Agents additionally require agent.operate and
        consume cluster-wide ingress capacity. All callers
        require mailbox.use and resource-level Send access. Idempotency-Key is
        scoped to the exact authenticated principal and binds tenant, mailbox,
        Draft UUID, and expected version. A 202 response means the durable
        worker will reconcile before creating any JMAP EmailSubmission; it
        does not assert final SMTP delivery.
      security:
        - mailBrowserSession: []
        - bearerAuth: []
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 22
            maxLength: 200
            pattern: "^[A-Za-z0-9._-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailSubmissionCreate" }
      responses:
        "202":
          description: Stable pending or replayed submission Intent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailSubmission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Draft/idempotency conflict, or a production Agent must obtain an
            exact agent.first_contact approval. The latter uses stable code
            agent_first_contact_approval_required and non-secret approval
            resource metadata. Testing Agents receive
            agent_mail_sandbox_required. Automatic reply loops receive
            agent_mail_automatic_reply_blocked. Inspect code rather than
            parsing message text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            A production Agent recipient is outside the active policy. The
            stable code is agent_mail_recipient_policy_denied; the response
            does not disclose which address failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            Agent ingress capacity, production hourly quota, per-recipient
            daily quota, thread circuit-breaker capacity, or exact duplicate
            body capacity is exhausted.
            Admission uses agent_mail_hourly_quota_exceeded,
            agent_mail_recipient_daily_quota_exceeded, or
            agent_mail_thread_circuit_breaker_open, or
            agent_mail_duplicate_content_circuit_breaker_open. Stable error
            codes and non-secret details identify the scope.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1, maximum: 3600 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/agent/mailboxes/{mailbox_id}/sandbox-submissions:
    post:
      operationId: captureAgentMailSandboxSubmission
      summary: Freeze one Testing-Agent draft without creating a deliverable submission.
      description: >
        Available only to an authenticated active Agent whose environment is
        testing. Requires mailbox.use, agent.operate, resource-level Send
        access, and cluster-wide ingress capacity. The exact draft version is
        frozen and captured as immutable tenant-scoped evidence in the same
        transaction as agent.mail_sandbox.captured audit and Outbox records.
        No JMAP EmailSubmission or other remote delivery operation is created.
        Idempotency-Key is scoped to the exact tenant and Agent; exact replay
        returns 200 with replayed=true, while a new capture returns 201.
      security:
        - bearerAuth: []
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 22
            maxLength: 200
            pattern: "^[A-Za-z0-9._-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMailSandboxCreate" }
      responses:
        "200":
          description: Exact idempotent replay of an existing capture.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMailSandbox" }
        "201":
          description: New immutable non-delivering sandbox capture.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMailSandbox" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Draft/version conflict or changed idempotent request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Agent tenant or principal ingress capacity is exhausted.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1, maximum: 60 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/mail-submissions/{submission_id}:
    get:
      operationId: getMailSubmission
      summary: Read the requesting principal's resource-authorized submission status.
      description: >
        `accepted` means Stalwart accepted the JMAP submission. The nullable
