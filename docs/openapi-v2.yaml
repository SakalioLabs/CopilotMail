        Human-only operation requiring identity.manage and audit.read. The
        server verifies an Active Human and both permissions in the same
        transaction before the exact Agent/submission pair is read and again
        before it commits High Audit and Outbox evidence. It exposes only
        immutable policy-activation and approval references, aggregate latest
