          description: Stable Intent state without vendor identifiers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailSubmission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Agent tenant or principal ingress capacity is exhausted.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1, maximum: 60 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
