      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailDomainDnsVerification"
      responses:
        "200":
          description: Immutable DNS observation recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailDomainDnsVerificationResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/mail-domains/{mail_domain_id}/ownership-challenge:
    post:
      operationId: rotateMailDomainOwnershipChallenge
      summary: Replace the ownership challenge and return the new token once.
      description: >
        Invalidates all evidence bound to the previous challenge and returns the
        domain to pending_dns. Active domains must be explicitly suspended first.
      security:
        - adminBrowserSession: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MailDomainId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailDomainChallengeRotation"
      responses:
        "200":
          description: Challenge replaced atomically; the plaintext token is not persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailDomainChallengeRotated"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/mail-domains/{mail_domain_id}/activation:
    post:
      operationId: activateMailDomain
      summary: Explicitly activate a verified domain using its latest fresh evidence.
      security:
        - adminBrowserSession: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MailDomainId"
      responses:
        "200":
          description: Domain activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailDomainAction"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/mail-domains/{mail_domain_id}/suspension:
    post:
      operationId: suspendMailDomain
      summary: Suspend an active domain and atomically disable both routes.
      security:
        - adminBrowserSession: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MailDomainId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailDomainSuspend"
      responses:
        "200":
          description: Domain suspended and routes disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailDomainAction"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/mail-domains/{mail_domain_id}/route:
    put:
      operationId: updateMailDomainRoute
      summary: CAS-update inbound and outbound route enablement.
      security:
        - adminBrowserSession: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MailDomainId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailDomainRouteUpdate"
      responses:
        "200":
          description: Route version updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailDomainRoute"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/mailboxes/{mailbox_id}/delegations:
    post:
      operationId: createMailboxDelegation
      summary: Grant explicit expiring scopes; caller must be the mailbox Owner.
      security:
        - adminBrowserSession: []
        - bearerAuth: []
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxDelegationCreate"
      responses:
        "201":
          description: Delegation, audit event, and Outbox event committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxDelegation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v2/mailbox-delegations/{delegation_id}:
    delete:
      operationId: revokeMailboxDelegation
      summary: Immediately revoke a delegation; caller must own its mailbox.
      security:
        - adminBrowserSession: []
        - bearerAuth: []
      parameters:
        - name: delegation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Delegation revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxDelegationRevoked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v2/approval-requests/{approval_request_id}/decisions:
    post:
      operationId: decideApprovalRequest
      summary: Append one irreversible decision by an independent authorized Principal.
      security:
        - adminBrowserSession: []
        - bearerAuth: []
      parameters:
        - name: approval_request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionCreate"
      responses:
        "200":
          description: Decision appended and aggregate status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /scim/v2/ServiceProviderConfig:
    get:
      operationId: getScimServiceProviderConfig
      responses:
        "200":
          description: Supported SCIM 2.0 protocol profile.
          content:
            application/scim+json:
              schema: { type: object }
  /scim/v2/ResourceTypes:
    get:
      operationId: listScimResourceTypes
      responses:
        "200":
          description: SCIM User and Group resource types.
          content:
            application/scim+json:
              schema: { type: object }
  /scim/v2/Schemas:
    get:
      operationId: listScimSchemas
      responses:
        "200":
          description: Supported SCIM core schema projections.
          content:
            application/scim+json:
              schema: { type: object }
  /scim/v2/Users:
    get:
      operationId: listScimUsers
      security: [{ scimBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ScimFilter"
        - $ref: "#/components/parameters/ScimStartIndex"
        - $ref: "#/components/parameters/ScimCount"
      responses:
        "200":
          $ref: "#/components/responses/ScimList"
        "401":
          $ref: "#/components/responses/ScimUnauthorized"
    post:
      operationId: createScimUser
      security: [{ scimBearer: [] }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: "#/components/schemas/ScimUserWrite" }
      responses:
        "201":
          description: User provisioned.
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimUser" }
        "409":
          $ref: "#/components/responses/ScimConflict"
  /scim/v2/Users/{id}:
    parameters:
      - $ref: "#/components/parameters/ScimResourceId"
    get:
      operationId: getScimUser
      security: [{ scimBearer: [] }]
      responses:
        "200":
          description: SCIM User.
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimUser" }
    put:
      operationId: replaceScimUser
      security: [{ scimBearer: [] }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: "#/components/schemas/ScimUserWrite" }
      responses:
        "200":
          description: User replaced.
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimUser" }
    patch:
      operationId: patchScimUser
      security: [{ scimBearer: [] }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: "#/components/schemas/ScimPatch" }
      responses:
        "200":
          description: User updated.
    delete:
      operationId: deactivateScimUser
      security: [{ scimBearer: [] }]
      responses:
        "204":
          description: User suspended while audit identity is retained.
  /scim/v2/Groups:
    get:
      operationId: listScimGroups
      security: [{ scimBearer: [] }]
      responses:
        "200":
          $ref: "#/components/responses/ScimList"
    post:
      operationId: createScimGroup
      security: [{ scimBearer: [] }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: "#/components/schemas/ScimGroupWrite" }
      responses:
        "201":
          description: Group provisioned.
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimGroup" }
  /scim/v2/Groups/{id}:
    parameters:
      - $ref: "#/components/parameters/ScimResourceId"
    get:
      operationId: getScimGroup
      security: [{ scimBearer: [] }]
      responses:
        "200":
          description: SCIM Group.
    put:
      operationId: replaceScimGroup
      security: [{ scimBearer: [] }]
      responses:
        "200": { description: Group and direct membership replaced. }
    patch:
      operationId: patchScimGroup
      security: [{ scimBearer: [] }]
      responses:
        "200": { description: Group or direct membership updated. }
    delete:
      operationId: deleteScimGroup
      security: [{ scimBearer: [] }]
      responses:
        "204": { description: Group deleted. }
components:
  securitySchemes:
    adminBrowserSession:
      type: apiKey
      in: cookie
      name: __Host-copilotmail-admin-session
      description: >
        Host-only HttpOnly Secure SameSite=Strict opaque Admin browser session
        cookie. Production never exposes this value to browser JavaScript;
        unsafe methods additionally require an exact Origin match.
    mailBrowserSession:
      type: apiKey
      in: cookie
      name: __Host-copilotmail-mail-session
      description: >
        Host-only HttpOnly Secure SameSite=Strict opaque Mail browser session
        cookie. It is accepted only by the bounded Human mailbox routes; unsafe
        methods additionally require an exact Origin match.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Agent OAuth2/mTLS token. A Human OIDC bearer is accepted only in an
        explicitly non-production compatibility mode; production requires
        an Admin or Mail browser session, selected by the route, for Human callers.
    scimBearer:
      type: http
      scheme: bearer
      description: Tenant-scoped, expiring SCIM provisioning token.
    agentOAuth:
      type: oauth2
      description: OAuth2 Client Credentials authenticated with an RFC 7523 private_key_jwt assertion.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            organization.read: Read non-sensitive organization metadata.
            agent.operate: Execute Agent-plane operations.
            mailbox.use: Use explicitly authorized mailbox capabilities.
    agentMutualTls:
      type: mutualTLS
      description: Native rustls client certificate verified against the configured Agent client CA.
    mailEventBearer:
      type: http
      scheme: bearer
      description: File-backed random credential configured only in Stalwart and CopilotMail.
    stalwartHmac:
      type: apiKey
      in: header
      name: X-Signature
      description: Base64 HMAC-SHA256 tag over the exact request body using a separate file-backed key.
  parameters:
    MailDomainId:
      name: mail_domain_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookSubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScimResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScimFilter:
      name: filter
      in: query
      schema: { type: string }
    ScimStartIndex:
      name: startIndex
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    ScimCount:
      name: count
      in: query
      schema: { type: integer, minimum: 0, maximum: 200, default: 100 }
    AgentProcessingSubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentProcessingMessageId:
      name: message_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 22
        maxLength: 200
        pattern: "^[A-Za-z0-9._-]+$"
  headers:
    RequestId:
      description: Request correlation identifier.
      schema:
        type: string
  schemas:
    HumanSession:
      type: object
      additionalProperties: false
      required: [principal_id, organization_id, client, expires_at]
      properties:
        principal_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        client:
          type: string
          enum: [admin, mail]
        expires_at:
          type: string
          format: date-time
    AgentJwks:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/AgentJwk"
    AgentJwk:
      type: object
      additionalProperties: false
      required: [kty, use, alg, kid, n, e]
      properties:
        kty: { type: string, const: RSA }
        use: { type: string, const: sig }
        alg: { type: string, const: RS256 }
        kid: { type: string, minLength: 1, maxLength: 128 }
        n: { type: string, description: Base64url RSA modulus without padding. }
        e: { type: string, description: Base64url RSA exponent without padding. }
    AgentTokenRequest:
      type: object
      additionalProperties: false
      required: [grant_type, client_id]
      oneOf:
        - required: [client_assertion_type, client_assertion]
          description: RFC 7523 private_key_jwt client authentication.
        - not:
            anyOf:
              - required: [client_assertion_type]
              - required: [client_assertion]
          description: RFC 8705 mTLS client authentication from the native TLS connection.
      properties:
        grant_type:
          type: string
          const: client_credentials
        client_id:
          type: string
          format: uuid
          description: Agent Principal ID.
        client_assertion_type:
          type: string
          const: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
        client_assertion:
          type: string
          description: RS256 JWT; kid is the Agent Credential ID and jti is single use. Omit for mTLS.
        scope:
          type: string
          description: Space-delimited subset of credential scopes and live RBAC permissions.
    AgentTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 900
        scope:
          type: string
    OAuthError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_scope, temporarily_unavailable]
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string }
        service: { type: string }
        version: { type: string }
    Readiness:
      type: object
      required: [status, dependencies]
      properties:
        status: { type: string }
        dependencies:
          type: object
          additionalProperties: { type: string }
    SystemInfo:
      type: object
      required: [api_version, build_version, principal_model]
      properties:
        api_version: { type: string }
        build_version: { type: string }
        principal_model: { type: string }
    Organization:
      type: object
      required: [organization_id, slug, display_name]
      properties:
        organization_id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
    ComplianceCaseCreate:
      type: object
      additionalProperties: false
      required: [external_reference, title, purpose]
      properties:
        external_reference: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 200 }
        purpose: { type: string, minLength: 1, maxLength: 2000 }
    ComplianceCase:
      type: object
      additionalProperties: false
      required:
        - case_id
        - organization_id
        - external_reference
        - title
        - purpose
        - status
        - created_by
        - created_at
        - closed_by
        - closed_at
      properties:
        case_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        external_reference: { type: string }
        title: { type: string }
        purpose: { type: string }
        status: { type: string, enum: [open, closed] }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        closed_by:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        closed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
    ComplianceCaseList:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ComplianceCase" }
        next_cursor:
          oneOf:
            - { type: string }
            - { type: "null" }
        has_more: { type: boolean }
    LegalHoldApply:
      type: object
      additionalProperties: false
      required: [case_id, approval_request_id, reason]
      properties:
        case_id: { type: string, format: uuid }
        approval_request_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    LegalHoldRelease:
      type: object
      additionalProperties: false
      required: [approval_request_id]
      properties:
        approval_request_id: { type: string, format: uuid }
    LegalHold:
      type: object
      additionalProperties: false
      required:
        - legal_hold_id
        - organization_id
        - case_id
        - archive_id
        - reason
        - status
        - apply_approval_request_id
        - created_by
        - created_at
        - release_approval_request_id
        - released_by
        - released_at
      properties:
        legal_hold_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        archive_id: { type: string, format: uuid }
        reason: { type: string }
        status: { type: string, enum: [active, released] }
        apply_approval_request_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        release_approval_request_id:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        released_by:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        released_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
    LegalHoldList:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/LegalHold" }
        next_cursor:
          oneOf:
            - { type: string }
            - { type: "null" }
        has_more: { type: boolean }
    AuditExportGrantCreate:
      type: object
      additionalProperties: false
      required: [approval_request_id]
      properties:
        approval_request_id: { type: string, format: uuid }
    AuditExportGrant:
      type: object
      additionalProperties: false
      required:
        - audit_export_grant_id
        - organization_id
        - archive_id
        - approval_request_id
        - requested_by
        - created_at
        - expires_at
      properties:
        audit_export_grant_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        archive_id: { type: string, format: uuid }
        approval_request_id: { type: string, format: uuid }
        requested_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    RetentionPolicyVersionCreate:
      type: object
      additionalProperties: false
      required:
        [minimum_retention_days, archive_after_days, delete_after_days, rule]
      properties:
        minimum_retention_days:
          { type: integer, format: int32, minimum: 1, maximum: 36500 }
        archive_after_days:
          type: [integer, "null"]
          format: int32
          minimum: 1
          maximum: 36500
        delete_after_days:
          type: [integer, "null"]
          format: int32
          minimum: 1
          maximum: 36500
        rule: { type: object, maxProperties: 32 }
    RetentionPolicyCreate:
      allOf:
        - type: object
          additionalProperties: false
          required:
            - policy_key
            - display_name
            - resource_kind
            - minimum_retention_days
            - archive_after_days
            - delete_after_days
            - rule
          properties:
            policy_key:
              type: string
              pattern: "^[a-z0-9]+([.][a-z0-9]+)*$"
              maxLength: 100
            display_name: { type: string, minLength: 1, maxLength: 200 }
            resource_kind:
              { type: string, enum: [audit_evidence, mail_content] }
            minimum_retention_days:
              { type: integer, format: int32, minimum: 1, maximum: 36500 }
            archive_after_days:
              type: [integer, "null"]
              format: int32
              minimum: 1
              maximum: 36500
            delete_after_days:
              type: [integer, "null"]
              format: int32
              minimum: 1
              maximum: 36500
            rule: { type: object, maxProperties: 32 }
    RetentionPolicyActivation:
      type: object
      additionalProperties: false
      required: [approval_request_id]
      properties:
        approval_request_id: { type: string, format: uuid }
    AgentMailPolicyActivationRequest:
      type: object
      additionalProperties: false
      required: [approval_request_id]
      properties:
        approval_request_id: { type: string, format: uuid }
    AgentMailPolicyActivation:
      type: object
      additionalProperties: false
      required:
        - activation_id
        - organization_id
        - agent_id
        - policy_version
        - approval_request_id
        - activated_by
