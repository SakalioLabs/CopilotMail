          schema: { type: string, format: uuid }
        - name: view
          in: query
          schema: { type: string, enum: [requested, actionable], default: actionable }
        - name: status
          in: query
          description: Actionable view accepts only pending; requested accepts every status.
          schema:
            type: string
            enum: [pending, approved, rejected, expired, cancelled]
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
