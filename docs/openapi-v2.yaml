        - name: cursor
          in: query
          description: Opaque versioned cursor returned by the previous page.
          schema:
            type: string
            maxLength: 80
            pattern: "^v1\\.[0-9a-f-]{36}\\.[0-9a-f-]{36}$"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Ordered page using the same stable envelope as signed webhooks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEventCursorPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Cursor anchor expired, is unavailable, or is not in this subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            The cluster-wide tenant or Agent one-minute ingress limit is
            reached. The response has Retry-After and a stable retryable code.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1, maximum: 60 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/webhook-subscriptions/{subscription_id}/stream:
    get:
      operationId: streamWebhookSubscriptionEvents
      summary: Stream externally safe events over a bounded Server-Sent Events connection.
      description: >
        Agent-only stream using the same subscription ownership, event allowlist,
        stable envelope, and opaque cursor as the pull endpoint. The connection
        sends keepalive comments every 15 seconds and closes after at most five
        minutes so clients periodically reauthenticate. Resume with either cursor
        or Last-Event-ID; if both are present they must be identical.
      security:
        - bearerAuth: [agent.operate]
      parameters:
        - $ref: "#/components/parameters/WebhookSubscriptionId"
        - name: cursor
          in: query
          description: Opaque subscription-scoped cursor from pull or SSE.
          schema:
            type: string
            maxLength: 80
            pattern: "^v1\\.[0-9a-f-]{36}\\.[0-9a-f-]{36}$"
        - name: Last-Event-ID
          in: header
          description: Opaque SSE event ID used when reconnecting.
          schema:
            type: string
            maxLength: 80
            pattern: "^v1\\.[0-9a-f-]{36}\\.[0-9a-f-]{36}$"
      responses:
        "200":
          description: >
            SSE frames. Each application frame uses its event type as the SSE
            event name, the opaque cursor as id, and AgentEventEnvelope JSON as
            data. A safe stream.error control frame may precede closure.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Accel-Buffering:
              schema: { type: string, const: "no" }
          content:
            text/event-stream:
              schema:
                type: string
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Cursor anchor expired, is unavailable, or is not in this subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            The cluster-wide tenant/Agent one-minute ingress rate or concurrent
            SSE lease limit is reached. Rate-limit responses include Retry-After;
            every case uses a stable retryable error code before HTTP 200.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1, maximum: 60 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/webhook-subscriptions/{subscription_id}/dead-letters/{event_id}/replay:
