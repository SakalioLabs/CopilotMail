          format: int64
          minimum: 1
        reply_to_message_id:
          type: ["string", "null"]
          format: uuid
          description: >
            Safe inbound CopilotMail message UUID. Raw Message-Id,
            In-Reply-To, References, JMAP Email, and Thread identifiers are
            never accepted.
        to:
          type: array
          maxItems: 100
          items: { type: string, format: email, maxLength: 254 }
        cc:
          type: array
          maxItems: 100
          items: { type: string, format: email, maxLength: 254 }
        bcc:
          type: array
          maxItems: 100
          items: { type: string, format: email, maxLength: 254 }
        subject:
          type: string
          maxLength: 998
          description: At most 998 UTF-8 bytes; maxLength is also enforced as a character bound.
        text_body:
          type: string
          maxLength: 262144
          description: At most 262144 UTF-8 bytes; maxLength is also enforced as a character bound.
    TextDraft:
      type: object
      additionalProperties: false
      required: [draft_id, version, reply_to_message_id, previous_draft_destroyed]
      properties:
        draft_id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        reply_to_message_id:
          type: ["string", "null"]
          format: uuid
        previous_draft_destroyed: { type: boolean }
    HumanDraftListItem:
      type: object
      additionalProperties: false
      required:
        [draft_id, version, reply_to_message_id, recipient_count, created_at, updated_at]
      properties:
        draft_id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        reply_to_message_id:
          type: ["string", "null"]
          format: uuid
        recipient_count: { type: integer, minimum: 1, maximum: 100 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HumanDraftList:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/HumanDraftListItem" }
        next_cursor:
          type: ["string", "null"]
          minLength: 39
          maxLength: 39
          pattern: "^v1\\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        has_more: { type: boolean }
    HumanSentDeliverySummary:
      type: object
      additionalProperties: false
      required:
        - observed_at
        - terminal
        - recipient_count
        - delivered_count
        - failed_count
        - queued_count
        - unknown_count
      properties:
        observed_at: { type: string, format: date-time }
        terminal: { type: boolean }
        recipient_count: { type: integer, minimum: 1, maximum: 100 }
        delivered_count: { type: integer, minimum: 0, maximum: 100 }
        failed_count: { type: integer, minimum: 0, maximum: 100 }
        queued_count: { type: integer, minimum: 0, maximum: 100 }
        unknown_count: { type: integer, minimum: 0, maximum: 100 }
    HumanSentListItem:
      type: object
      additionalProperties: false
      required: [submission_id, accepted_at, recipient_count]
      properties:
        submission_id: { type: string, format: uuid }
        accepted_at: { type: string, format: date-time }
        recipient_count: { type: integer, minimum: 1, maximum: 100 }
        delivery:
          $ref: "#/components/schemas/HumanSentDeliverySummary"
    HumanSentList:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/HumanSentListItem" }
        next_cursor:
          type: ["string", "null"]
          minLength: 39
          maxLength: 39
          pattern: "^v1\\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        has_more: { type: boolean }
    HumanDraftRestoreRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
    HumanDraftRestore:
      type: object
      additionalProperties: false
      required: [draft_id, version, reply_to_message_id, to, cc, bcc, subject, text_body]
      properties:
        draft_id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        reply_to_message_id:
          type: ["string", "null"]
          format: uuid
        to:
          type: array
          maxItems: 100
          items: { type: string, format: email, maxLength: 254 }
        cc:
          type: array
          maxItems: 100
          items: { type: string, format: email, maxLength: 254 }
        bcc:
          type: array
          maxItems: 100
          items: { type: string, format: email, maxLength: 254 }
        subject: { type: string, maxLength: 998 }
        text_body: { type: string, maxLength: 262144 }
    MailSubmissionCreate:
      type: object
      additionalProperties: false
      required: [draft_id, expected_draft_version]
      properties:
        draft_id: { type: string, format: uuid }
        expected_draft_version: { type: integer, format: int64, minimum: 1 }
        first_contact_approval_request_id:
          type: ["string", "null"]
          format: uuid
          description: >
            Exact live agent.first_contact approval bound to
            agent.mail_draft and "{draft_id}:{expected_draft_version}".
    AgentMailSandboxCreate:
      type: object
      additionalProperties: false
      required: [draft_id, expected_draft_version]
      properties:
        draft_id: { type: string, format: uuid }
        expected_draft_version: { type: integer, format: int64, minimum: 1 }
    AgentMailSandbox:
      type: object
      additionalProperties: false
      required:
        - sandbox_submission_id
        - mailbox_id
        - draft_id
        - draft_version
        - recipient_count
        - delivery_suppressed
        - captured_at
        - replayed
      properties:
        sandbox_submission_id: { type: string, format: uuid }
        mailbox_id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
        draft_version: { type: integer, format: int64, minimum: 2 }
        recipient_count: { type: integer, minimum: 1, maximum: 100 }
        delivery_suppressed: { type: boolean, const: true }
        captured_at: { type: string, format: date-time }
        replayed: { type: boolean }
    MailSubmission:
      type: object
      additionalProperties: false
      required:
        - submission_id
        - mailbox_id
        - draft_id
        - draft_version
        - status
        - state_version
        - created_at
        - updated_at
        - delivery
      properties:
        submission_id: { type: string, format: uuid }
        mailbox_id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
        draft_version: { type: integer, format: int64, minimum: 1 }
        status:
          type: string
          enum: [pending, reconciling, accepted, rejected, manual_review]
        state_version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        delivery:
          oneOf:
            - { $ref: "#/components/schemas/MailDelivery" }
            - { type: "null" }
    MailDelivery:
      type: object
      additionalProperties: false
      required:
        - observed_at
        - terminal
        - recipient_count
        - delivered_count
        - failed_count
        - queued_count
        - unknown_count
        - recipients
      properties:
        observed_at: { type: string, format: date-time }
        terminal: { type: boolean }
        recipient_count: { type: integer, minimum: 1, maximum: 100 }
        delivered_count: { type: integer, minimum: 0, maximum: 100 }
        failed_count: { type: integer, minimum: 0, maximum: 100 }
        queued_count: { type: integer, minimum: 0, maximum: 100 }
        unknown_count: { type: integer, minimum: 0, maximum: 100 }
        recipients:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/MailDeliveryRecipient" }
    MailDeliveryRecipient:
      type: object
      additionalProperties: false
      required: [recipient_ref, status, smtp_reply]
      properties:
        recipient_ref:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Submission-scoped recipient digest; it is not correlatable across mail.
        status:
          type: string
          enum: [queued, delivered, permanent_failure, unknown]
        smtp_reply: { type: string, minLength: 1, maxLength: 1024 }
    MailEngineMailboxBindingUpdate:
      type: object
      additionalProperties: false
      required: [account_ref, expected_version]
      properties:
        account_ref:
          type: string
          pattern: "^(0|[1-9][0-9]{0,19})$"
        expected_version: { type: integer, format: int64, minimum: 0 }
    MailEngineMailboxBinding:
      type: object
      additionalProperties: false
      required:
        [organization_id, mailbox_id, data_plane_id, account_ref, version, updated_at]
      properties:
        organization_id: { type: string, format: uuid }
        mailbox_id: { type: string, format: uuid }
        data_plane_id:
          type: string
          format: uuid
          description: Stable namespace for opaque references; it is not a vendor name.
        account_ref:
          type: string
          pattern: "^(0|[1-9][0-9]{0,19})$"
        version: { type: integer, format: int64, minimum: 1 }
        updated_at: { type: string, format: date-time }
    StalwartEventBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - $ref: "#/components/schemas/StalwartInboundMessageEvent"
              - $ref: "#/components/schemas/StalwartDeliveredEvent"
              - $ref: "#/components/schemas/StalwartFailedEvent"
              - $ref: "#/components/schemas/StalwartRescheduledEvent"
              - $ref: "#/components/schemas/StalwartCompletedEvent"
    StalwartInboundMessageEvent:
      type: object
      additionalProperties: false
      required: [id, createdAt, type, data]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        createdAt: { type: string, format: date-time }
        type:
          type: string
          enum: [message-ingest.ham, message-ingest.spam]
        data:
          type: object
          required: [accountId, documentId, mailboxId]
          properties:
            accountId: { type: integer, minimum: 0 }
            documentId: { type: integer, minimum: 0 }
            mailboxId:
              type: array
              minItems: 1
              maxItems: 128
              items: { type: integer, minimum: 0 }
          additionalProperties: true
          description: >
            Vendor fields may be present, but CopilotMail discards everything
            except accountId, documentId, and validation of mailboxId.
    StalwartDeliveredEvent:
      type: object
      additionalProperties: false
      required: [id, createdAt, type, data]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        createdAt: { type: string, format: date-time }
        type: { type: string, const: delivery.delivered }
        data:
          type: object
          required: [queueId, from, to, code]
          properties:
            queueId: { type: integer, minimum: 0 }
            from: { type: string, format: email, minLength: 3, maxLength: 320 }
            to: { type: string, format: email, minLength: 3, maxLength: 320 }
            code: { type: integer, minimum: 200, maximum: 299 }
          additionalProperties: true
          description: >
            CopilotMail retains only the normalized identifiers and SMTP code;
            response text, hostnames, and all other vendor fields are discarded.
    StalwartFailedEvent:
      type: object
      additionalProperties: false
      required: [id, createdAt, type, data]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        createdAt: { type: string, format: date-time }
        type: { type: string, const: delivery.failed }
        data:
          type: object
          required: [queueId, from, to]
          properties:
            queueId: { type: integer, minimum: 0 }
            from: { type: string, format: email, minLength: 3, maxLength: 320 }
            to: { type: string, format: email, minLength: 3, maxLength: 320 }
          additionalProperties: true
          description: Remote response text and reason fields are discarded.
    StalwartRescheduledEvent:
      type: object
      additionalProperties: false
      required: [id, createdAt, type, data]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        createdAt: { type: string, format: date-time }
        type: { type: string, const: queue.rescheduled }
        data:
          type: object
          required: [queueId, from, nextRetry]
          properties:
            queueId: { type: integer, minimum: 0 }
            from: { type: string, format: email, minLength: 3, maxLength: 320 }
            nextRetry: { type: string, format: date-time }
          additionalProperties: true
          description: >
            nextRetry must be later than createdAt. Recipient arrays, expiry,
            response details, and other vendor fields are discarded.
    StalwartCompletedEvent:
      type: object
      additionalProperties: false
      required: [id, createdAt, type, data]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        createdAt: { type: string, format: date-time }
        type: { type: string, const: delivery.completed }
        data:
          type: object
          required: [queueId, from]
          properties:
            queueId: { type: integer, minimum: 0 }
            from: { type: string, format: email, minLength: 3, maxLength: 320 }
          additionalProperties: true
          description: Recipient arrays and all other vendor fields are discarded.
    MailEventIngressResult:
      type: object
      additionalProperties: false
      required: [accepted, inserted, duplicates]
      properties:
        accepted: { type: integer, minimum: 1, maximum: 100 }
        inserted: { type: integer, minimum: 0, maximum: 100 }
        duplicates: { type: integer, minimum: 0, maximum: 100 }
    WebhookEventType:
      type: string
      enum:
        - message.received.v1
        - message.delivery_status_changed.v1
        - agent.message.dead_lettered.v1
    WebhookSubscriptionCreate:
      type: object
      additionalProperties: false
      required: [principal_id, endpoint_url, event_types, signing_key_reference]
      properties:
        principal_id: { type: string, format: uuid }
        endpoint_url:
          type: string
          format: uri
          minLength: 8
          maxLength: 2048
          description: HTTPS URL without userinfo, query, or fragment.
        event_types:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/WebhookEventType" }
        signing_key_reference:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
          description: Reference into the configured server-side signing key set; never a secret.
    WebhookSubscriptionUpdate:
      type: object
      additionalProperties: false
      required:
        [expected_version, endpoint_url, event_types, signing_key_reference, enabled]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        endpoint_url:
          type: string
          format: uri
          minLength: 8
          maxLength: 2048
        event_types:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/WebhookEventType" }
        signing_key_reference:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
        enabled: { type: boolean }
    WebhookSubscription:
      type: object
      additionalProperties: false
      required:
        [subscription_id, organization_id, principal_id, endpoint_url,
         event_types, signing_key_reference, enabled, version, created_at,
         updated_at]
      properties:
        subscription_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        endpoint_url: { type: string, format: uri }
        event_types:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/WebhookEventType" }
        signing_key_reference:
          type: string
          pattern: "^[A-Za-z0-9._-]+$"
        enabled: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookSubscriptionList:
      type: object
      additionalProperties: false
      required: [items, next_after]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/WebhookSubscription" }
        next_after: { type: ["string", "null"], format: uuid }
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [event_id, organization_id, actor_principal_id, actor_kind,
         on_behalf_of_principal_id, credential_id, subject_principal_id,
         action, resource_type, resource_id, outcome, trace_id, request_id,
         source_ip, client_id, session_id, token_jti, policy_id,
         policy_version_id, approval_request_id, ticket_reference, environment,
         region, details, occurred_at, received_at, chain_sequence,
         hash_version, previous_hash, event_hash, signature_batch_id]
      properties:
        event_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        actor_principal_id: { type: string, format: uuid }
        actor_kind:
          type: string
          enum: [human, agent, service]
        on_behalf_of_principal_id: { type: ["string", "null"], format: uuid }
        credential_id: { type: ["string", "null"] }
        subject_principal_id: { type: ["string", "null"], format: uuid }
        action:
          type: string
          pattern: "^[a-z][a-z0-9_.]+$"
        resource_type:
          type: string
          pattern: "^[a-z][a-z0-9_.]+$"
        resource_id: { type: string, minLength: 1, maxLength: 512 }
        outcome:
          type: string
          enum: [success, failure, denied]
        trace_id: { type: string, minLength: 1, maxLength: 200 }
        request_id: { type: string, minLength: 1, maxLength: 200 }
        source_ip: { type: ["string", "null"] }
        client_id: { type: ["string", "null"], maxLength: 500 }
        session_id: { type: ["string", "null"], maxLength: 500 }
        token_jti: { type: ["string", "null"], maxLength: 500 }
        policy_id: { type: ["string", "null"], format: uuid }
        policy_version_id: { type: ["string", "null"], format: uuid }
        approval_request_id: { type: ["string", "null"], format: uuid }
        ticket_reference: { type: ["string", "null"], maxLength: 500 }
        environment: { type: ["string", "null"], maxLength: 100 }
        region: { type: ["string", "null"], maxLength: 100 }
        details:
          description: Sanitized metadata; secrets, message bodies, MIME, and attachment content are forbidden.
          type: object
          additionalProperties: true
        occurred_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        chain_sequence:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Decimal PostgreSQL BIGINT encoded as text to preserve browser precision.
        hash_version: { type: integer, minimum: 1 }
        previous_hash:
          type: ["string", "null"]
          pattern: "^[0-9a-f]{64}$"
        event_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        signature_batch_id: { type: ["string", "null"], format: uuid }
    AuditEventSearch:
      type: object
      additionalProperties: false
      required:
        [query_id, occurred_from, occurred_to, items, next_cursor, has_more]
      properties:
        query_id: { type: string, format: uuid }
        occurred_from: { type: string, format: date-time }
        occurred_to: { type: string, format: date-time }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_cursor:
          type: ["string", "null"]
          maxLength: 64
          pattern: "^v1\\.[0-9a-f-]{36}\\.[1-9][0-9]*$"
        has_more: { type: boolean }
    AgentEventAggregate:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          pattern: "^[a-z0-9_]+(?:\\.[a-z0-9_]+)*$"
        id: { type: string, minLength: 1, maxLength: 512 }
    AgentEventEnvelope:
      type: object
      additionalProperties: false
      required:
        [id, organization_id, type, schema_version, occurred_at, aggregate, data]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/WebhookEventType" }
        schema_version: { type: integer, minimum: 1 }
        occurred_at: { type: string, format: date-time }
        aggregate: { $ref: "#/components/schemas/AgentEventAggregate" }
        data:
          type: object
          additionalProperties: true
    AgentEventCursorPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/AgentEventEnvelope" }
        next_cursor:
          type: ["string", "null"]
          maxLength: 80
          pattern: "^v1\\.[0-9a-f-]{36}\\.[0-9a-f-]{36}$"
        has_more: { type: boolean }
    WebhookDeadLetter:
      type: object
      additionalProperties: false
      required:
        [delivery_id, subscription_id, principal_id, event_id, event_type,
         attempt, response_status, error_code, failed_at]
      properties:
        delivery_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        event_type: { $ref: "#/components/schemas/WebhookEventType" }
        attempt: { type: integer, minimum: 1 }
        response_status:
          type: ["integer", "null"]
          minimum: 100
          maximum: 599
        error_code:
          type: string
          pattern: "^[a-z0-9_.-]+$"
        failed_at: { type: string, format: date-time }
    WebhookDeadLetterList:
      type: object
      additionalProperties: false
      required: [items, next_after]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/WebhookDeadLetter" }
        next_after: { type: ["string", "null"], format: uuid }
    WebhookDeadLetterReplay:
      type: object
      additionalProperties: false
      required: [subscription_id, event_id, attempt, status]
      properties:
        subscription_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        attempt: { type: integer, minimum: 2 }
        status:
          type: string
          const: retrying
    MailDomainCreate:
      type: object
      additionalProperties: false
      required: [name, route_mode]
      properties:
        name: { type: string, minLength: 3, maxLength: 253 }
        route_mode:
          type: string
          enum: [direct_mx, smart_host]
    MailDomainCreated:
      type: object
      additionalProperties: false
      required:
        [mail_domain_id, organization_id, name, status,
         ownership_challenge_version, route_version, ownership_record_name,
         ownership_token]
      properties:
        mail_domain_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          const: pending_dns
        ownership_challenge_version: { type: integer, format: int64, minimum: 1 }
        route_version: { type: integer, format: int64, minimum: 1 }
        ownership_record_name: { type: string }
        ownership_token:
          type: string
          readOnly: true
          description: One-time secret output; publish as the exact ownership TXT value.
    MailDomainChallengeRotated:
      type: object
      additionalProperties: false
      required:
        [mail_domain_id, status, ownership_challenge_version,
         ownership_record_name, ownership_token]
      properties:
        mail_domain_id: { type: string, format: uuid }
        status:
          type: string
          const: pending_dns
        ownership_challenge_version: { type: integer, format: int64, minimum: 2 }
        ownership_record_name: { type: string }
        ownership_token:
          type: string
          readOnly: true
          description: One-time replacement secret; never returned by later reads.
    MailDomainChallengeRotation:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
          description: Current ownership_challenge_version from the domain read model.
    MailDomain:
      type: object
      additionalProperties: false
      required:
        [mail_domain_id, organization_id, name, status, route_mode,
         ownership_challenge_version, route_version, inbound_enabled,
         outbound_enabled, mail_engine_projection_status,
         latest_dns_activation_ready, latest_dns_failure_codes]
      properties:
        mail_domain_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [draft, pending_dns, verified, active, suspended, retired]
        route_mode:
          type: string
          enum: [direct_mx, smart_host]
        ownership_challenge_version: { type: integer, format: int64, minimum: 1 }
        route_version: { type: integer, format: int64, minimum: 1 }
        inbound_enabled: { type: boolean }
        outbound_enabled: { type: boolean }
        smart_host_ref: { type: ["string", "null"] }
        dkim_key_ref: { type: ["string", "null"] }
        mail_engine_domain_ref: { type: ["string", "null"], maxLength: 512 }
        mail_engine_projection_status:
          type: string
          enum: [not_projected, pending, ready, failed]
        mail_engine_projected_enabled: { type: ["boolean", "null"] }
        mail_engine_projection_last_attempt_at:
          type: ["string", "null"]
          format: date-time
        mail_engine_projection_succeeded_at:
          type: ["string", "null"]
          format: date-time
        mail_engine_projection_error_code:
          type: ["string", "null"]
          pattern: "^[a-z0-9_.-]+$"
        latest_dns_observed_at: { type: ["string", "null"], format: date-time }
        latest_dns_valid_until: { type: ["string", "null"], format: date-time }
        latest_dns_activation_ready: { type: boolean }
        latest_dns_failure_codes:
          type: array
          maxItems: 32
          items: { type: string }
    MailDomainList:
      type: object
      additionalProperties: false
      required: [items, next_after]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MailDomain"
        next_after: { type: ["string", "null"] }
    MailDomainDnsVerification:
      type: object
      additionalProperties: false
      required: [domain, ownership_token, dkim_selector]
      properties:
        domain: { type: string, minLength: 3, maxLength: 253 }
        ownership_token:
          type: string
          writeOnly: true
          minLength: 32
          maxLength: 512
        dkim_selector:
          type: string
          pattern: "^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$"
    MailDomainDnsVerificationResult:
      type: object
      additionalProperties: false
      required:
        [mail_domain_id, status, activation_ready, valid_until, failure_codes]
      properties:
        mail_domain_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending_dns, verified, active]
        activation_ready: { type: boolean }
        valid_until: { type: string, format: date-time }
        failure_codes:
          type: array
          maxItems: 32
          items: { type: string }
    MailDomainAction:
      type: object
      additionalProperties: false
      required: [mail_domain_id, status]
      properties:
        mail_domain_id: { type: string, format: uuid }
        status:
          type: string
          enum: [active, suspended]
    MailDomainSuspend:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code:
          type: string
          pattern: "^[a-z0-9_.-]+$"
          maxLength: 100
    MailDomainRouteUpdate:
      type: object
      additionalProperties: false
      required: [expected_version, inbound_enabled, outbound_enabled]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        inbound_enabled: { type: boolean }
        outbound_enabled: { type: boolean }
        smart_host_ref: { type: ["string", "null"], maxLength: 512 }
        dkim_key_ref: { type: ["string", "null"], maxLength: 512 }
    MailDomainRoute:
      type: object
      additionalProperties: false
      required:
        [mail_domain_id, version, inbound_enabled, outbound_enabled]
      properties:
        mail_domain_id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 2 }
        inbound_enabled: { type: boolean }
        outbound_enabled: { type: boolean }
    MailboxDelegationCreate:
      type: object
      additionalProperties: false
      required: [grantee_principal_id, capabilities, reason, valid_until]
      properties:
        grantee_principal_id: { type: string, format: uuid }
        capabilities:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [mailbox.read, mailbox.send, mailbox.send_as]
        reason: { type: string, minLength: 1, maxLength: 1000 }
        valid_until: { type: string, format: date-time }
    MailboxDelegation:
      type: object
      additionalProperties: false
      required:
        [delegation_id, mailbox_id, grantor_principal_id, grantee_principal_id]
      properties:
        delegation_id: { type: string, format: uuid }
        mailbox_id: { type: string, format: uuid }
        grantor_principal_id: { type: string, format: uuid }
        grantee_principal_id: { type: string, format: uuid }
    MailboxDelegationRevoked:
      type: object
      additionalProperties: false
      required: [delegation_id, revoked]
      properties:
        delegation_id: { type: string, format: uuid }
        revoked: { type: boolean, const: true }
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [approval_request_id, status]
      properties:
        approval_request_id: { type: string, format: uuid }
        status: { type: string, const: pending }
    ApprovalRequestSummary:
      type: object
      additionalProperties: false
      required:
        - approval_request_id
        - organization_id
        - policy_version_id
        - action
        - resource_kind
        - resource_id
        - requested_by
        - reason
        - ticket_reference
        - required_approvals
        - approval_count
        - rejection_count
        - status
        - created_at
        - expires_at
        - completed_at
        - cancelled_at
      properties:
        approval_request_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        policy_version_id: { type: string, format: uuid }
        action: { $ref: "#/components/schemas/ApprovalAction" }
        resource_kind: { type: string, minLength: 1, maxLength: 100 }
        resource_id: { type: string, minLength: 1, maxLength: 500 }
        requested_by: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        ticket_reference: { type: ["string", "null"], minLength: 1, maxLength: 500 }
        required_approvals: { type: integer, minimum: 1, maximum: 5 }
        approval_count: { type: integer, minimum: 0, maximum: 5 }
        rejection_count: { type: integer, minimum: 0, maximum: 1 }
        status:
          type: string
          enum: [pending, approved, rejected, expired, cancelled]
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        completed_at: { type: ["string", "null"], format: date-time }
        cancelled_at: { type: ["string", "null"], format: date-time }
    ApprovalStep:
      type: object
      additionalProperties: false
      required:
        [approval_step_id, approver_principal_id, decision, reason, decided_at]
      properties:
        approval_step_id: { type: string, format: uuid }
        approver_principal_id: { type: string, format: uuid }
        decision: { type: string, enum: [approved, rejected] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        decided_at: { type: string, format: date-time }
    ApprovalRequestDetail:
      type: object
      additionalProperties: false
      required: [request, steps]
      properties:
        request: { $ref: "#/components/schemas/ApprovalRequestSummary" }
        steps:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ApprovalStep" }
    ApprovalRequestList:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ApprovalRequestSummary" }
        next_cursor: { type: ["string", "null"] }
        has_more: { type: boolean }
    ApprovalCancellation:
      type: object
      additionalProperties: false
    Role:
      type: object
      additionalProperties: false
      required:
        [role_id, organization_id, system_role, display_name, permissions, created_at]
      properties:
        role_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        system_role:
          type: string
          enum:
            - org_owner
            - mail_admin
            - security_admin
            - compliance_auditor
            - content_reviewer
            - helpdesk
            - agent_operator
            - employee
            - break_glass
        display_name: { type: string, minLength: 1, maxLength: 200 }
        permissions:
          type: array
          uniqueItems: true
          maxItems: 14
          items:
            type: string
            enum:
              - organization.read
              - organization.manage
              - identity.manage
              - authorization.manage
              - mail.admin
              - security.admin
              - audit.read
              - audit.export
              - legal_hold.manage
              - retention.manage
              - content.review
              - agent.operate
              - mailbox.use
              - break_glass.invoke
        created_at: { type: string, format: date-time }
    RoleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 9
          items: { $ref: "#/components/schemas/Role" }
    RoleAssignmentGrant:
      type: object
      additionalProperties: false
      required: [principal_id, role_id, valid_until, approval_request_id]
      properties:
        principal_id: { type: string, format: uuid }
        role_id: { type: string, format: uuid }
        valid_until:
          type: string
          format: date-time
          description: Millisecond-aligned instant no more than 365 days in the future.
        approval_request_id: { type: string, format: uuid }
    RoleAssignment:
      type: object
      additionalProperties: false
      required:
        - role_assignment_id
        - organization_id
        - principal_id
        - principal_kind
        - principal_status
        - principal_display_name
        - role_id
        - system_role
        - role_display_name
        - created_by
        - approval_request_id
        - valid_from
        - valid_until
        - revoked_at
        - created_at
        - active
      properties:
        role_assignment_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        principal_id: { type: string, format: uuid }
        principal_kind: { type: string, enum: [human, agent, service] }
        principal_status: { type: string, enum: [draft, active, suspended, retired] }
        principal_display_name: { type: string, minLength: 1, maxLength: 200 }
        role_id: { type: string, format: uuid }
        system_role:
          type: string
          enum:
            - org_owner
            - mail_admin
            - security_admin
            - compliance_auditor
            - content_reviewer
            - helpdesk
            - agent_operator
            - employee
            - break_glass
        role_display_name: { type: string, minLength: 1, maxLength: 200 }
        created_by: { type: string, format: uuid }
        approval_request_id: { type: ["string", "null"], format: uuid }
        valid_from: { type: string, format: date-time }
        valid_until: { type: ["string", "null"], format: date-time }
        revoked_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }
        active: { type: boolean }
    RoleAssignmentList:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RoleAssignment" }
        next_cursor: { type: ["string", "null"], maxLength: 256 }
        has_more: { type: boolean }
    RoleAssignmentRevocation:
      type: object
      additionalProperties: false
    ApprovalDecisionCreate:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [approval_request_id, status, approval_count]
      properties:
        approval_request_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, approved, rejected, expired, cancelled]
        approval_count: { type: integer, minimum: 0, maximum: 5 }
    ApprovalAction:
      type: string
      enum:
        - mail.send_as
        - mail.send_on_behalf_of
        - compliance.content_review
        - audit.export
        - compliance.retention_change
        - authorization.privilege_elevation
        - compliance.legal_hold
        - security.break_glass
        - mail.bulk_delete
        - agent.production_mail
        - agent.first_contact
    ScimUserWrite:
      type: object
      required: [schemas, externalId, userName, displayName]
      properties:
        schemas:
          type: array
          prefixItems:
            - const: "urn:ietf:params:scim:schemas:core:2.0:User"
        externalId: { type: string, maxLength: 512 }
        userName: { type: string, maxLength: 320 }
        displayName: { type: string, maxLength: 200 }
        active: { type: boolean, default: true }
    ScimUser:
      allOf:
        - $ref: "#/components/schemas/ScimUserWrite"
        - type: object
          required: [id, meta]
          properties:
            id: { type: string, format: uuid }
            meta: { type: object }
    ScimGroupWrite:
      type: object
      required: [schemas, externalId, displayName]
      properties:
        schemas:
          type: array
          prefixItems:
            - const: "urn:ietf:params:scim:schemas:core:2.0:Group"
        externalId: { type: string, maxLength: 512 }
        displayName: { type: string, maxLength: 200 }
        members:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [value]
            properties:
              value: { type: string, format: uuid }
    ScimGroup:
      allOf:
        - $ref: "#/components/schemas/ScimGroupWrite"
        - type: object
          required: [id, meta]
          properties:
            id: { type: string, format: uuid }
            meta: { type: object }
    ScimPatch:
      type: object
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          prefixItems:
            - const: "urn:ietf:params:scim:api:messages:2.0:PatchOp"
        Operations:
          type: array
          minItems: 1
          items: { type: object }
    ScimError:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas: { type: array, items: { type: string } }
        status: { type: string }
        scimType: { type: string }
        detail: { type: string }
    Error:
      type: object
      required: [code, message, request_id, trace_id, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
        retryable: { type: boolean }
        details: {}
  responses:
    OAuthError:
      description: OAuth2 token exchange failed.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        Pragma:
          schema: { type: string, const: no-cache }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
    Unauthorized:
      description: Missing, invalid, or inactive identity.
      headers:
        WWW-Authenticate:
          schema: { type: string }
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MailSessionUnauthorized:
      description: A valid Mail Human browser session is required; Bearer credentials are not accepted.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        Referrer-Policy:
          schema: { type: string, const: no-referrer }
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Request syntax or domain policy is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated identity lacks the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource is absent or belongs to another tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Current resource, idempotency, lease, or approval state rejects the transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AgentRateLimited:
      description: Agent tenant or principal ingress capacity is exhausted.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1, maximum: 60 }
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Authentication, authorization, or storage dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ScimList:
      description: SCIM paged ListResponse.
      content:
        application/scim+json:
          schema: { type: object }
    ScimUnauthorized:
      description: Missing, expired, revoked, or inactive-owner SCIM credential.
      content:
        application/scim+json:
          schema: { $ref: "#/components/schemas/ScimError" }
    ScimConflict:
      description: SCIM uniqueness conflict.
      content:
        application/scim+json:
          schema: { $ref: "#/components/schemas/ScimError" }
